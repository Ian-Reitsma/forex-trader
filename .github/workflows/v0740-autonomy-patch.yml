name: v0.7.40 autonomy patch

on:
  push:
    branches:
      - feat/autonomous-practice-v0.7.40

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-practice-v0.7.40
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply autonomy/runtime patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found: {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          # Runtime identity.
          replace_once(
              "src/forex_trader/__init__.py",
              '__version__ = "0.7.39"',
              '__version__ = "0.7.40"',
          )
          replace_once(
              "tests/test_version_identity.py",
              'assert __version__ == "0.7.39"',
              'assert __version__ == "0.7.40"',
          )

          # Point-in-time fundamentals can be reloaded after an official sync without
          # rebuilding the broker/runtime object graph.
          replace_once(
              "src/forex_trader/domain/macro_history.py",
              '''    def append(self, observation: MacroObservation) -> None:\n        if any(existing.observation_id == observation.observation_id for existing in self._observations):\n            return\n        self._observations.append(observation)\n        self._observations.sort(key=lambda item: (item.available_at, str(item.observation_id)))\n\n    def observations(self, *, as_of: datetime | None = None) -> list[MacroObservation]:\n''',
              '''    def append(self, observation: MacroObservation) -> None:\n        if any(existing.observation_id == observation.observation_id for existing in self._observations):\n            return\n        self._observations.append(observation)\n        self._observations.sort(key=lambda item: (item.available_at, str(item.observation_id)))\n\n    def replace_observations(self, observations: Iterable[MacroObservation]) -> None:\n        """Atomically replace observation history while preserving immutable seed state."""\n        self._observations = sorted(\n            list(observations),\n            key=lambda item: (item.available_at, str(item.observation_id)),\n        )\n\n    def observations(self, *, as_of: datetime | None = None) -> list[MacroObservation]:\n''',
          )

          # Durable runtime heartbeat/state plus strict strategy-trade attribution and
          # financing-aware promotion accounting.
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              "from __future__ import annotations\n\nimport json",
              "from __future__ import annotations\n\nfrom collections.abc import Mapping\nimport json",
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''            self._connection.execute(\n                """\n                CREATE TABLE IF NOT EXISTS broker_cursors (\n                    name TEXT PRIMARY KEY,\n                    value TEXT NOT NULL,\n                    updated_at TEXT NOT NULL\n                )\n                """\n            )\n''',
              '''            self._connection.execute(\n                """\n                CREATE TABLE IF NOT EXISTS broker_cursors (\n                    name TEXT PRIMARY KEY,\n                    value TEXT NOT NULL,\n                    updated_at TEXT NOT NULL\n                )\n                """\n            )\n            self._connection.execute(\n                """\n                CREATE TABLE IF NOT EXISTS runtime_state (\n                    name TEXT PRIMARY KEY,\n                    payload_json TEXT NOT NULL,\n                    updated_at TEXT NOT NULL\n                )\n                """\n            )\n''',
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''    def get_broker_cursor(self, name: str) -> str | None:\n        row = self._connection.execute(\n            "SELECT value FROM broker_cursors WHERE name = ?", (name,)\n        ).fetchone()\n        return None if row is None else str(row["value"])\n\n    def promotion_metrics(self) -> PromotionMetrics:\n''',
              '''    def get_broker_cursor(self, name: str) -> str | None:\n        row = self._connection.execute(\n            "SELECT value FROM broker_cursors WHERE name = ?", (name,)\n        ).fetchone()\n        return None if row is None else str(row["value"])\n\n    def set_runtime_state(self, name: str, payload: Mapping[str, object]) -> None:\n        if not name.strip():\n            raise ValueError("runtime state name is required")\n        encoded = json.dumps(jsonable(dict(payload)), sort_keys=True)\n        with self._lock, self._connection:\n            self._connection.execute(\n                """\n                INSERT INTO runtime_state(name, payload_json, updated_at)\n                VALUES (?, ?, datetime('now'))\n                ON CONFLICT(name) DO UPDATE SET\n                    payload_json=excluded.payload_json,\n                    updated_at=excluded.updated_at\n                """,\n                (name, encoded),\n            )\n\n    def runtime_state(self, name: str) -> dict[str, object] | None:\n        row = self._connection.execute(\n            "SELECT payload_json, updated_at FROM runtime_state WHERE name = ?",\n            (name,),\n        ).fetchone()\n        if row is None:\n            return None\n        payload = json.loads(str(row["payload_json"]))\n        if not isinstance(payload, dict):\n            raise RuntimeError(f"runtime state {name} is not a JSON object")\n        result = {str(key): value for key, value in payload.items()}\n        result["updated_at"] = str(row["updated_at"])\n        return result\n\n    def promotion_metrics(self) -> PromotionMetrics:\n''',
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''        our_orders: set[str] = set()\n        our_trades: set[str] = set()\n        closed_values: list[Decimal] = []\n''',
              '''        our_orders: set[str] = set()\n        our_trades: set[str] = set()\n        financing_by_trade: dict[str, Decimal] = {}\n        closed_values: list[Decimal] = []\n''',
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''                if client_id.startswith("ft-") or tag == "forex-trader":\n''',
              '''                if client_id.startswith("ft-") and tag == "forex-trader":\n''',
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''            if transaction.get("type") == "ORDER_FILL":\n                order_id = str(transaction.get("orderID") or "")\n''',
              '''            if transaction.get("type") == "DAILY_FINANCING":\n                position_financings = transaction.get("positionFinancings")\n                if isinstance(position_financings, list):\n                    for position_financing in position_financings:\n                        if not isinstance(position_financing, dict):\n                            continue\n                        open_trade_financings = position_financing.get("openTradeFinancings")\n                        if not isinstance(open_trade_financings, list):\n                            continue\n                        for trade_financing in open_trade_financings:\n                            if not isinstance(trade_financing, dict):\n                                continue\n                            trade_id = str(trade_financing.get("tradeID") or "")\n                            if trade_id not in our_trades:\n                                continue\n                            financing_by_trade[trade_id] = financing_by_trade.get(\n                                trade_id, Decimal("0")\n                            ) + Decimal(str(trade_financing.get("financing", "0")))\n\n            if transaction.get("type") == "ORDER_FILL":\n                order_id = str(transaction.get("orderID") or "")\n''',
          )
          replace_once(
              "src/forex_trader/infrastructure/repository.py",
              '''                        if str(trade.get("tradeID") or "") not in our_trades:\n                            continue\n                        value = Decimal(str(trade.get("realizedPL", transaction.get("pl", "0"))))\n                        value += Decimal(str(trade.get("financing", "0")))\n                        closed_values.append(value)\n''',
              '''                        trade_id = str(trade.get("tradeID") or "")\n                        if trade_id not in our_trades:\n                            continue\n                        value = Decimal(str(trade.get("realizedPL", transaction.get("pl", "0"))))\n                        value += Decimal(str(trade.get("financing", "0")))\n                        value += financing_by_trade.pop(trade_id, Decimal("0"))\n                        closed_values.append(value)\n''',
          )

          # Final protected state still proves a broker fill occurred. Preserve the
          # protection subset counter while making the fill counter lifecycle-correct.
          replace_once(
              "src/forex_trader/application/campaign.py",
              '''            if status is OrderStatus.FILLED:\n                filled += 1\n            elif status is OrderStatus.PROTECTED:\n                protected += 1\n            elif status is OrderStatus.REJECTED:\n''',
              '''            if status in {OrderStatus.FILLED, OrderStatus.PROTECTED}:\n                filled += 1\n            if status is OrderStatus.PROTECTED:\n                protected += 1\n            elif status is OrderStatus.REJECTED:\n''',
          )
          replace_once(
              "tests/test_campaign.py",
              '''    assert report.orders_submitted == 1\n    assert report.orders_protected == 1\n''',
              '''    assert report.orders_submitted == 1\n    assert report.orders_filled == 1\n    assert report.orders_protected == 1\n''',
          )

          # Execution readiness is now a real write-boundary gate rather than only an
          # observational dashboard endpoint. Base/simulation repositories without the
          # readiness contract retain their existing deterministic test behavior.
          replace_once(
              "src/forex_trader/application/engine.py",
              "from forex_trader.application.ports import DecisionRepository, MarketDataProvider, PaperBroker\n",
              "from forex_trader.application.ports import DecisionRepository, MarketDataProvider, PaperBroker\nfrom forex_trader.application.readiness import assess_engine_readiness\n",
          )
          replace_once(
              "src/forex_trader/application/engine.py",
              '''            halt_reason = self._account_halt_reason(account_id)\n            if halt_reason:\n                denied = self.risk_policy.deny(candidate, f"account is halted: {halt_reason}", account_id=account_id)\n                return candidate, denied, None, self.market_data.quote(candidate.instrument), initial_account, list(self.broker.positions())\n\n            account = self.broker.account()\n''',
              '''            halt_reason = self._account_halt_reason(account_id)\n            if halt_reason:\n                denied = self.risk_policy.deny(candidate, f"account is halted: {halt_reason}", account_id=account_id)\n                return candidate, denied, None, self.market_data.quote(candidate.instrument), initial_account, list(self.broker.positions())\n\n            readiness_reason = self._execution_readiness_reason(candidate.instrument)\n            if readiness_reason is not None:\n                denied = self.risk_policy.deny(candidate, readiness_reason, account_id=account_id)\n                return (\n                    candidate,\n                    denied,\n                    None,\n                    self.market_data.quote(candidate.instrument),\n                    initial_account,\n                    list(self.broker.positions()),\n                )\n\n            account = self.broker.account()\n''',
          )
          replace_once(
              "src/forex_trader/application/engine.py",
              '''    def _account_halt_reason(self, account_id: str) -> str | None:\n''',
              '''    def _execution_readiness_reason(self, instrument: str) -> str | None:\n        checker = getattr(self.repository, "execution_ready", None)\n        if checker is None:\n            return None\n        try:\n            _, _, readiness = assess_engine_readiness(self, instrument)\n        except (AttributeError, RuntimeError, ValueError) as exc:\n            return f"runtime readiness assessment failed: {type(exc).__name__}: {exc}"\n        if readiness.ready:\n            return None\n        reasons = "; ".join(readiness.reasons) or "runtime data-quality readiness is false"\n        return f"runtime readiness blocked execution: {reasons}"\n\n    def _account_halt_reason(self, account_id: str) -> str | None:\n''',
          )
          replace_once(
              "src/forex_trader/application/engine.py",
              '''    def status(self) -> dict[str, object]:\n        account = self.broker.account()\n        return {\n            "mode": self.mode.value,\n            "paper_orders_enabled": self.enable_paper_orders,\n            "fundamental_currencies": [item.currency for item in self.fundamentals.snapshots()],\n            "account": jsonable(account),\n            "execution_halt": self._account_halt_reason(account.account_id),\n            "promotion": self.promotion_status(),\n        }\n\n''',
              '''    def runtime_status(self) -> dict[str, object]:\n        getter = getattr(self.repository, "runtime_state", None)\n        if getter is None:\n            return {\n                "active": False,\n                "healthy": False,\n                "stale": True,\n                "reason": "repository does not expose autonomous runtime heartbeat state",\n            }\n        raw = getter("autonomous_practice")\n        if not isinstance(raw, dict):\n            return {\n                "active": False,\n                "healthy": False,\n                "stale": True,\n                "reason": "no autonomous Practice runtime heartbeat has been recorded",\n            }\n        payload: dict[str, object] = {str(key): value for key, value in raw.items()}\n        heartbeat_raw = payload.get("heartbeat_at")\n        try:\n            heartbeat = datetime.fromisoformat(str(heartbeat_raw)).astimezone(UTC)\n        except (TypeError, ValueError):\n            heartbeat = None\n        try:\n            interval_seconds = float(payload.get("interval_seconds", 300.0))\n        except (TypeError, ValueError):\n            interval_seconds = 300.0\n        stale_after = max(900.0, max(0.0, interval_seconds) * 3.0)\n        age_seconds = (\n            None\n            if heartbeat is None\n            else max(0.0, (datetime.now(UTC) - heartbeat).total_seconds())\n        )\n        stale = age_seconds is None or age_seconds > stale_after\n        active = bool(payload.get("active"))\n        declared = str(payload.get("status") or "unknown")\n        healthy = active and not stale and declared in {"starting", "running"}\n        if not active:\n            reason = "autonomous Practice runtime is not active"\n        elif stale:\n            reason = "autonomous Practice runtime heartbeat is stale"\n        elif declared not in {"starting", "running"}:\n            reason = f"autonomous Practice runtime reports {declared}"\n        else:\n            reason = "autonomous Practice runtime heartbeat is healthy"\n        payload.update(\n            {\n                "active": active,\n                "healthy": healthy,\n                "stale": stale,\n                "heartbeat_age_seconds": age_seconds,\n                "stale_after_seconds": stale_after,\n                "reason": reason,\n            }\n        )\n        return payload\n\n    def status(self) -> dict[str, object]:\n        account = self.broker.account()\n        return {\n            "mode": self.mode.value,\n            "paper_orders_enabled": self.enable_paper_orders,\n            "fundamental_currencies": [item.currency for item in self.fundamentals.snapshots()],\n            "account": jsonable(account),\n            "execution_halt": self._account_halt_reason(account.account_id),\n            "runtime": self.runtime_status(),\n            "promotion": self.promotion_status(),\n        }\n\n''',
          )

          # Control API exposes the heartbeat directly as well as inside /v1/status.
          replace_once(
              "src/forex_trader/api/app.py",
              '''    @app.get("/v1/account", dependencies=protected)\n    def account() -> dict[str, object]:\n''',
              '''    @app.get("/v1/runtime", dependencies=repository_protected)\n    def runtime_status() -> dict[str, object]:\n        return engine.runtime_status()\n\n    @app.get("/v1/account", dependencies=protected)\n    def account() -> dict[str, object]:\n''',
          )

          # OANDA execute mode now uses the durable runtime. The explicit autonomous
          # command is the canonical all-eligible-pair daemon; run --execute can use the
          # same runtime for configured pairs or --all-currency-pairs.
          replace_once(
              "src/forex_trader/cli.py",
              "from forex_trader.api.app import create_app\n",
              "from forex_trader.api.app import create_app\nfrom forex_trader.application.autonomous import AutonomousPracticeRuntime\n",
          )
          old_run = '''@app.command(name="run")\ndef run_bot(\n    interval_seconds: float = typer.Option(60.0, min=0.0),\n    execute: bool = typer.Option(False, help="Allow paper orders when configuration also permits them"),\n    max_cycles: int | None = typer.Option(None, min=1, help="Stop after this many cycles; omit to run continuously"),\n    macro_file: Path | None = typer.Option(None, exists=True, dir_okay=False),\n) -> None:\n    """Run the polling bot until interrupted or max-cycles is reached."""\n    config = AppConfig.from_env()\n    engine = build_engine(config, macro_file=str(macro_file) if macro_file else None)\n\n    def report_error(instrument: str, exc: Exception) -> None:\n        typer.echo(json.dumps({"instrument": instrument, "error": f"{type(exc).__name__}: {str(exc)[:240]}"}), err=True)\n\n    traces = run_cycles(\n        engine,\n        config.instruments,\n        execute=execute,\n        interval_seconds=interval_seconds,\n        max_cycles=max_cycles,\n        on_error=report_error,\n    )\n    if max_cycles is not None:\n        typer.echo(json.dumps([jsonable(trace) for trace in traces], indent=2))\n\n\n'''
          new_run = '''@app.command(name="run")\ndef run_bot(\n    interval_seconds: float | None = typer.Option(\n        None, help="Polling interval; OANDA Practice execution defaults to the lower-timeframe bar"\n    ),\n    execute: bool = typer.Option(False, help="Allow paper orders when configuration also permits them"),\n    max_cycles: int | None = typer.Option(None, min=1, help="Stop after this many cycles; omit to run continuously"),\n    all_currency_pairs: bool = typer.Option(\n        False, help="For OANDA Practice execution, dynamically discover and prefilter the broker currency universe"\n    ),\n    max_orders_per_cycle: int = typer.Option(1, min=0),\n    fundamental_refresh_seconds: float = typer.Option(3600.0, min=1.0),\n    universe_refresh_seconds: float = typer.Option(3600.0, min=1.0),\n    evidence_path: Path = typer.Option(Path("autonomous-campaign-evidence.jsonl")),\n    decision_evidence_path: Path = typer.Option(Path("autonomous-decision-evidence.jsonl")),\n    macro_file: Path | None = typer.Option(None, exists=True, dir_okay=False),\n) -> None:\n    """Run polling continuously; OANDA execute mode adds reconciliation and durable heartbeat."""\n    config = AppConfig.from_env()\n    if all_currency_pairs and not execute:\n        raise typer.BadParameter("--all-currency-pairs on run requires --execute; use scan for one-shot shadow discovery")\n\n    if execute and config.provider is ProviderKind.OANDA:\n        if macro_file is not None:\n            raise typer.BadParameter("OANDA autonomous execution uses durable official fundamentals, not --macro-file")\n        runtime = AutonomousPracticeRuntime(\n            config,\n            all_currency_pairs=all_currency_pairs or config.auto_discover_currency_instruments,\n            max_new_orders_per_cycle=max_orders_per_cycle,\n            interval_seconds=interval_seconds,\n            fundamental_refresh_seconds=fundamental_refresh_seconds,\n            universe_refresh_seconds=universe_refresh_seconds,\n            evidence_path=evidence_path,\n            decision_evidence_path=decision_evidence_path,\n        )\n        runtime.run(\n            max_cycles=max_cycles,\n            on_cycle=lambda report: typer.echo(json.dumps(report.to_jsonable(), indent=2, sort_keys=True)),\n        )\n        return\n\n    engine = build_engine(config, macro_file=str(macro_file) if macro_file else None)\n\n    def report_error(instrument: str, exc: Exception) -> None:\n        typer.echo(json.dumps({"instrument": instrument, "error": f"{type(exc).__name__}: {str(exc)[:240]}"}), err=True)\n\n    traces = run_cycles(\n        engine,\n        config.instruments,\n        execute=execute,\n        interval_seconds=60.0 if interval_seconds is None else interval_seconds,\n        max_cycles=max_cycles,\n        on_error=report_error,\n    )\n    if max_cycles is not None:\n        typer.echo(json.dumps([jsonable(trace) for trace in traces], indent=2))\n\n\n@app.command()\ndef autonomous(\n    interval_seconds: float | None = typer.Option(\n        None, help="Defaults to one configured lower-timeframe bar"\n    ),\n    max_cycles: int | None = typer.Option(None, min=1, help="Omit to run continuously"),\n    max_orders_per_cycle: int = typer.Option(1, min=0),\n    fundamental_refresh_seconds: float = typer.Option(3600.0, min=1.0),\n    universe_refresh_seconds: float = typer.Option(3600.0, min=1.0),\n    evidence_path: Path = typer.Option(Path("autonomous-campaign-evidence.jsonl")),\n    decision_evidence_path: Path = typer.Option(Path("autonomous-decision-evidence.jsonl")),\n) -> None:\n    """Run the canonical all-eligible-pair OANDA Practice daemon."""\n    config = AppConfig.from_env()\n    runtime = AutonomousPracticeRuntime(\n        config,\n        all_currency_pairs=True,\n        max_new_orders_per_cycle=max_orders_per_cycle,\n        interval_seconds=interval_seconds,\n        fundamental_refresh_seconds=fundamental_refresh_seconds,\n        universe_refresh_seconds=universe_refresh_seconds,\n        evidence_path=evidence_path,\n        decision_evidence_path=decision_evidence_path,\n    )\n    runtime.run(\n        max_cycles=max_cycles,\n        on_cycle=lambda report: typer.echo(json.dumps(report.to_jsonable(), indent=2, sort_keys=True)),\n    )\n\n\n'''
          replace_once("src/forex_trader/cli.py", old_run, new_run)

          # Read-only smoke now describes the whole account instead of implying that the
          # first configured instrument's position flag is global.
          replace_once(
              "scripts/smoke_oanda.py",
              '''        payload = client.practice_probe(config.instruments[0])\n        specs = client.currency_instruments()\n        payload["currency_instruments"] = len(specs)\n        payload["sample_instruments"] = [spec.name for spec in specs[:10]]\n''',
              '''        payload = client.practice_probe(config.instruments[0])\n        specs = client.currency_instruments()\n        account = client.account()\n        positions = [position for position in client.positions() if position.net_units != 0]\n        payload["currency_instruments"] = len(specs)\n        payload["sample_instruments"] = [spec.name for spec in specs[:10]]\n        payload["account_open_position_count"] = account.open_position_count\n        payload["account_unrealized_pl"] = str(account.unrealized_pl)\n        payload["open_positions"] = [\n            {\n                "instrument": position.instrument,\n                "net_units": str(position.net_units),\n                "long_average_price": None\n                if position.long_average_price is None\n                else str(position.long_average_price),\n                "short_average_price": None\n                if position.short_average_price is None\n                else str(position.short_average_price),\n                "unrealized_pl": str(position.unrealized_pl),\n            }\n            for position in positions\n        ]\n''',
          )

          # The UI must distinguish API connectivity from a live trading heartbeat.
          replace_once(
              "src/forex_trader/frontend/app.js",
              '''    $('runtimeOrbit').classList.toggle('online', connected);\n    $('runtimeState').textContent = connected ? 'STREAMING' : 'OFFLINE';\n''',
              '''    if (!connected) {\n      $('runtimeOrbit').classList.remove('online');\n      $('runtimeState').textContent = 'OFFLINE';\n    }\n''',
          )
          replace_once(
              "src/forex_trader/frontend/app.js",
              '''    const mode = String(statusData.mode || '—').toUpperCase();\n    $('modeValue').textContent = mode;\n''',
              '''    const mode = String(statusData.mode || '—').toUpperCase();\n    const runtime = statusData.runtime || {};\n    const runtimeHealthy = runtime.healthy === true;\n    $('runtimeOrbit').classList.toggle('online', runtimeHealthy);\n    $('runtimeState').textContent = runtimeHealthy\n      ? 'AUTONOMOUS'\n      : runtime.active\n        ? (runtime.stale ? 'STALE' : 'DEGRADED')\n        : 'IDLE';\n    $('modeValue').textContent = mode;\n''',
          )

          # API regression: runtime endpoint/status state is observable without confusing it
          # with API liveness.
          api_test = Path("tests/test_api.py")
          api_text = api_test.read_text()
          api_text += '''\n\ndef test_api_exposes_autonomous_runtime_heartbeat(engine) -> None:  # type: ignore[no-untyped-def]\n    client = local_client(engine)\n    runtime = client.get("/v1/runtime")\n    assert runtime.status_code == 200\n    assert runtime.json()["active"] is False\n    status = client.get("/v1/status").json()\n    assert status["runtime"]["active"] is False\n'''
          api_test.write_text(api_text)

          # Current observed promotion regression: a capability probe is not a strategy
          # trade, and separate DAILY_FINANCING belongs to the strategy trade that earned it.
          doc = Path("docs/58_AUTONOMOUS_PRACTICE_RUNTIME.md")
          doc.write_text('''# Autonomous OANDA Practice Runtime\n\n`forex-trader serve` is intentionally observational. It serves the authenticated API and UI but does not evaluate markets.\n\nThe canonical continuous Practice process is:\n\n```bash\nforex-trader autonomous --max-orders-per-cycle 1\n```\n\nOmit `--max-cycles` to run continuously. The runtime defaults to one configured lower-timeframe bar between cycles, discovers the broker currency universe, prefilters pairs that cannot satisfy the configured point-in-time fundamental confidence requirement, and never relaxes strategy or risk gates to manufacture fills.\n\nEach cycle is fail-closed around broker state: it catches up the durable OANDA transaction cursor before evaluation, refreshes free first-party official fundamentals on cadence, reloads the point-in-time fundamental book, refreshes broker discovery on cadence, evaluates the eligible universe with the existing Practice-authorized strategy/risk policy, and catches up broker transactions again after the cycle. Unresolved broker writes stop further risk.\n\nA durable `autonomous_practice` heartbeat is stored in SQLite. `/v1/runtime` and `/v1/status.runtime` report whether the trading process is active, its campaign/cycle, eligible/discovered counts, broker cursor, last fundamental refresh, errors, heartbeat age and staleness. API liveness is not trading liveness.\n\n`forex-trader run --execute` also uses the durable OANDA runtime. Add `--all-currency-pairs` (or set `FOREX_AUTO_DISCOVER_CURRENCY_INSTRUMENTS=true`) to use broker discovery; otherwise it preserves the configured instrument list. Non-OANDA/shadow `run` retains the generic polling loop.\n\nPromotion accounting accepts only strategy client IDs with the `ft-` prefix plus the `forex-trader` tag. Explicit `probe-` round trips are excluded. OANDA `DAILY_FINANCING` rows are attributed to owned open trade IDs and included in the strategy trade's realized economics.\n\nA final `protected` lifecycle state counts as both a broker fill and verified protection in campaign aggregates. Execution also rechecks runtime data-quality readiness at the write boundary before submitting Practice risk.\n''')

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "All notable changes to this repository are documented here.\n\n"
          entry = '''## 0.7.40 — 2026-08-10\n\n### Autonomous Practice runtime\n\n- Added a dedicated continuous OANDA Practice runtime with pre/post-cycle broker reconciliation, broker-discovered/fundamental-eligible universe refresh, periodic free-official fundamental refresh/reload, bounded per-cycle order authority, evidence persistence and durable heartbeat state.\n- `forex-trader autonomous` is the canonical all-eligible-pair daemon; OANDA `forex-trader run --execute` now uses the same durable orchestration and supports `--all-currency-pairs`. The API server remains observational.\n- Added `/v1/runtime` and runtime health/staleness inside `/v1/status`; the frontend no longer labels API connectivity itself as `STREAMING`.\n- Enforced data-quality readiness at the broker-write boundary when the durable reconciliation/readiness contract is present.\n- Corrected campaign lifecycle telemetry so a final `protected` order counts as both filled and protection-verified.\n- Promotion accounting now excludes explicit `probe-` capability round trips and attributes separate OANDA daily financing to owned strategy trades.\n- Expanded the read-only OANDA smoke report to expose whole-account open-position count, unrealized P/L and open positions.\n\n### Safety boundary\n\n- No strategy threshold, spread ceiling, slippage ceiling, risk fraction, exposure limit or live-money authority was relaxed. Execution remains OANDA Practice-only and unresolved broker state remains fail-closed.\n\n'''
          if marker not in text:
              raise SystemExit("changelog marker missing")
          changelog.write_text(text.replace(marker, marker + entry, 1))
          PY

      - name: Install dev environment
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src scripts

      - name: Full Ruff
        run: ruff check src scripts tests

      - name: Strict application/domain mypy
        run: |
          mypy --strict \
            src/forex_trader/application \
            src/forex_trader/domain

      - name: Full pytest
        run: pytest -q

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs CHANGELOG.md
          git commit -m 'v0.7.40: make Practice execution autonomous and reconciled'
          git push origin HEAD:feat/autonomous-practice-v0.7.40
