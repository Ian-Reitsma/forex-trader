name: Partial runner development backtest

on:
  pull_request:
    paths:
      - "src/forex_trader/research/partial_runner_backtest.py"
      - "src/forex_trader/research/partial_runner_exact.py"
      - "src/forex_trader/research/partial_runner_exact_generation.py"
      - "src/forex_trader/research/partial_runner_selection.py"
      - "scripts/run_partial_runner_development.py"
      - "tests/test_partial_runner_exact.py"
      - ".github/workflows/partial-runner-development.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partial-runner-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore historical cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: partial-runner-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            adaptive-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v5-
            scalp-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v4-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Partial runner lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/research/partial_runner_exact.py
          src/forex_trader/research/partial_runner_exact_generation.py
          src/forex_trader/research/partial_runner_selection.py
          scripts/run_partial_runner_development.py
          tests/test_partial_runner_exact.py
      - name: Partial runner strict typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          src/forex_trader/research/partial_runner_exact.py
          src/forex_trader/research/partial_runner_exact_generation.py
          src/forex_trader/research/partial_runner_selection.py
          scripts/run_partial_runner_development.py
      - name: Partial runner tests
        run: pytest -q tests/test_partial_runner_exact.py tests/test_managed_tick_backtest.py
      - name: Run development campaign
        run: >-
          python scripts/run_partial_runner_development.py
          --instruments EUR_USD,GBP_USD,USD_JPY
          --start 2026-05-20
          --end 2026-08-07
          --minimum-development-trades 30
          --minimum-fold-trades 5
          --concurrency-per-pair 12
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --output artifacts/partial-runner-development.json
      - name: Save historical cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/forex-trader/public-history
          key: partial-runner-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - name: Summarize development result
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/partial-runner-development.json").read_text())
          print("## Exact partial-profit runner development")
          print()
          print(f"Period: {report['period']['start']} -> {report['period']['end']}")
          for name, block in report['selection'].items():
              p = block['policy']
              r = p['report']
              print()
              print(f"### {name}")
              print(f"Profile: {p['profile']}")
              print(f"Instrument: {p['instrument']}")
              print(f"Direction: {p['direction']}")
              print(f"Trades: {r['trades']}")
              print(f"Economic win rate: {p['economic_win_rate']}")
              print(f"Expectancy R: {r['expectancy_r']}")
              print(f"Profit factor: {r['profit_factor']}")
              print(f"LCB expectancy: {p['lower_confidence_expectancy_r']}")
          PY
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-runner-development
          path: artifacts/partial-runner-development.json
          if-no-files-found: warn
          retention-days: 14
