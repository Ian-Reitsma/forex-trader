name: v0.7.24 audit gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Audit tranche lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/application/campaign_policy.py
          src/forex_trader/config.py
          src/forex_trader/domain/macro_factor_risk.py
          src/forex_trader/domain/risk_advanced.py
          src/forex_trader/research/flow_strategies.py
          src/forex_trader/research/technical_annotation.py
          scripts/create_technical_annotation_batch.py
          scripts/finalize_technical_annotations.py
          tests/test_audit_risk_and_technical_validation.py
          tests/test_macro_factor_campaign_identity.py
      - name: Audit tranche strict typing
        shell: bash
        run: |
          set +e
          python -m mypy --strict --follow-imports=silent \
            src/forex_trader/application/campaign_policy.py \
            src/forex_trader/config.py \
            src/forex_trader/domain/macro_factor_risk.py \
            src/forex_trader/domain/risk_advanced.py \
            src/forex_trader/research/flow_strategies.py \
            src/forex_trader/research/technical_annotation.py \
            scripts/create_technical_annotation_batch.py \
            scripts/finalize_technical_annotations.py \
            2>&1 | tee /tmp/audit-mypy.txt
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload audit typing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-mypy-${{ matrix.python-version }}
          path: /tmp/audit-mypy.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Focused audit tests
        run: >-
          pytest -q
          tests/test_audit_risk_and_technical_validation.py
          tests/test_macro_factor_campaign_identity.py
          tests/test_campaign_policy.py
          tests/test_config.py
