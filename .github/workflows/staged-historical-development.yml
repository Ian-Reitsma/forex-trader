name: Staged historical Forex Scalper development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-historical-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged-development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore historical cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: staged-jan-mar-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            staged-jan-mar-history-${{ runner.os }}-v1-
            partial-runner-history-${{ runner.os }}-v1-
            adaptive-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v5-
            scalp-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v4-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Staged runner lint
        run: >-
          ruff check --select E4,E7,E9,F
          scripts/run_staged_historical_development.py
          tests/test_staged_historical_development_runner.py
      - name: Staged runner strict typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          scripts/run_staged_historical_development.py
      - name: Staged runner tests
        run: pytest -q tests/test_staged_historical_development_runner.py tests/test_portfolio_risk_replay.py tests/test_institutional_flow_research.py tests/test_structured_zones.py tests/test_release_surprise_history.py
      - name: Run January-March development ablation
        run: >-
          python scripts/run_staged_historical_development.py
          --instruments EUR_USD,GBP_USD,USD_JPY
          --start 2026-01-05
          --end 2026-04-01
          --warmup-days 14
          --concurrency-per-pair 12
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --risk-fraction 0.0015
          --starting-balance 100000
          --output artifacts/staged-historical-development-v1.json
      - name: Save historical cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/forex-trader/public-history
          key: staged-jan-mar-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - name: Summarize staged result
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/staged-historical-development-v1.json").read_text())
          print("## Jan 5 - Mar 31 staged historical development")
          print()
          for name in ("legacy_technical", "structured_zone", "pit_macro_surprise", "centralized_flow"):
              stage = report["stages"][name]
              print(f"### {name}")
              print(f"Status: {stage['status']}")
              print(f"Selected: {stage['selected_executions']} / {stage['input_executions']}")
              if stage.get("report"):
                  print(f"Trades: {stage['report']['trades']}")
                  print(f"Win rate: {stage['report']['win_rate']}")
                  print(f"Expectancy R: {stage['report']['expectancy_r']}")
                  print(f"Profit factor: {stage['report']['profit_factor']}")
              if stage.get("reason"):
                  print(f"Reason: {stage['reason']}")
              print()
          risk = report["stages"]["production_portfolio_risk"]
          print("### production_portfolio_risk")
          print(f"Input stage: {risk['input_stage']}")
          print(f"Admitted: {risk['risk_report']['admitted_trades']}")
          print(f"Denied: {risk['risk_report']['denied_trades']}")
          print(f"Total return: {risk['risk_report']['total_return']}")
          print(f"Correlation enforced: {risk['risk_report']['correlation_enforced']}")
          print()
          print(f"Strict pipeline complete through real flow: {report['strict_pipeline']['complete_through_real_flow']}")
          if report['strict_pipeline']['stopped_reason']:
              print(f"Stopped reason: {report['strict_pipeline']['stopped_reason']}")
          PY
      - name: Upload staged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-historical-development-v1
          path: artifacts/staged-historical-development-v1.json
          if-no-files-found: warn
          retention-days: 30
