name: Public historical strategy backtest

on:
  pull_request:
    paths:
      - "src/forex_trader/research/public_history.py"
      - "src/forex_trader/research/resilient_tick_history.py"
      - "src/forex_trader/research/official_news_history.py"
      - "src/forex_trader/research/tick_backtest.py"
      - "scripts/run_public_historical_backtest.py"
      - "scripts/run_official_historical_backtest.py"
      - ".github/workflows/public-historical-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore public history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: public-fx-history-${{ runner.os }}-v4-${{ github.sha }}
          restore-keys: |
            public-fx-history-${{ runner.os }}-v4-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run exact bid-ask and official-news walk-forward campaign
        run: >-
          python scripts/run_official_historical_backtest.py
          --instruments EUR_USD,GBP_USD,USD_JPY
          --days 35
          --lag-days 7
          --minimum-calibration-trades 10
          --concurrency-per-pair 4
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --output artifacts/public-historical-backtest.json
      - name: Save incremental public history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/forex-trader/public-history
          key: public-fx-history-${{ runner.os }}-v4-${{ github.sha }}
      - name: Summarize backtest
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/public-historical-backtest.json").read_text())
          print("## Exact bid/ask + official central-bank historical backtest")
          print()
          print(f"Period: {report['period']['start']} -> {report['period']['end']}")
          print(f"Opportunities: {report['total_opportunities']}")
          print(f"News records: {report['news_records']} ({report['strong_news_observations']} strong)")
          print(f"News mode: {report.get('news_source_mode')}")
          for name, block in report.get("selection", {}).items():
              if not isinstance(block, dict) or "frozen" not in block:
                  print(f"Selection status: {block}")
                  continue
              frozen = block["frozen"]
              holdout = frozen["holdout_report"]
              daily = frozen["holdout_daily_returns"]
              print()
              print(f"### {name}")
              print(f"Trades: {holdout['trades']}")
              print(f"Win rate: {holdout['win_rate']}")
              print(f"Expectancy R: {holdout['expectancy_r']}")
              print(f"Profit factor: {holdout['profit_factor']}")
              print(f"Max drawdown R: {holdout['max_drawdown_r']}")
              print(f"Average daily return @ 0.15% risk/trade: {daily['average_daily_return']}")
          PY
      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-historical-backtest
          path: artifacts/public-historical-backtest.json
          if-no-files-found: warn
          retention-days: 14
