name: v0.7.28 historical backtest gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backtest-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Backtest lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/research/public_history.py
          src/forex_trader/research/tick_backtest.py
          scripts/run_public_historical_backtest.py
          tests/test_public_history.py
          tests/test_tick_backtest.py
      - name: Backtest strict typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          src/forex_trader/research/public_history.py
          src/forex_trader/research/tick_backtest.py
          scripts/run_public_historical_backtest.py
      - name: Focused backtest tests
        run: pytest -q tests/test_public_history.py tests/test_tick_backtest.py tests/test_backtest.py tests/test_phase_d_entry_profit_optimization.py
