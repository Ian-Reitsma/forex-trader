name: Strict quality validation

on:
  push:
    branches: [fix/strict-quality-v0.7.39]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-quality-v0.7.39
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Full-tree Ruff
        run: ruff check src scripts tests
      - name: Strict application/domain mypy
        run: python -m mypy --strict src/forex_trader/application src/forex_trader/domain
      - name: Full pytest
        run: pytest -q
