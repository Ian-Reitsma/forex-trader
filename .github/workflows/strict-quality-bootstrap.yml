name: Strict quality bootstrap

on:
  push:
    branches: [fix/strict-quality-v0.7.39]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-quality-v0.7.39
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic patch
        run: python scripts/_apply_strict_quality_patch.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No source/test patch changes to commit"
            exit 0
          fi
          git commit -m "Remove final dead backtest assignment"
          git push origin HEAD:fix/strict-quality-v0.7.39
