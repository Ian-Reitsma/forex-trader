name: Apply verified v0.3 source update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified archive
        shell: bash
        run: |
          cat .forex-v03.part1 .forex-v03.part2 .forex-v03.part3 .forex-v03.part4 .forex-v03.part5 .forex-v03.part6 | tr -d '\r\n ' | base64 -d > /tmp/forex-v03.tar.bz2
          echo "4a9ee767af9bcb73d06b4c7ff01b10ca97fbfc4748c1628ff8ca642d3d0d2bf0  /tmp/forex-v03.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/forex-v03.tar.bz2
          git add -A
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Verify exact extracted source
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q src scripts
          python -m pip check
          python scripts/check_no_secrets.py
          pytest --cov=forex_trader --cov-report=term-missing
          TMPDB=$(mktemp /tmp/forex-trader-v03-XXXXXX.db)
          FOREX_PROVIDER=simulation FOREX_MODE=paper FOREX_ENABLE_PAPER_ORDERS=true FOREX_DATABASE_PATH="$TMPDB" forex-trader demo --instrument EUR_USD --execute > /tmp/forex-smoke.json
          python - <<'PY'
          import json
          with open('/tmp/forex-smoke.json') as fh:
              payload = json.load(fh)
          assert payload['candidate']['disposition'] == 'trade'
          assert payload['risk']['disposition'] == 'granted'
          assert payload['order']['status'] == 'filled'
          PY
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement point-in-time fundamentals, OANDA reconciliation, portfolio risk and promotion gates"
          git push origin HEAD:main
