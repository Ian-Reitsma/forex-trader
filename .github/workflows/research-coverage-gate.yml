name: Research coverage gate

on:
  pull_request:
    paths:
      - "tests/test_managed_tick_backtest_edges.py"
      - "tests/test_adaptive_managed_strategy_edges.py"
      - ".github/workflows/research-coverage-gate.yml"

permissions:
  contents: read

jobs:
  research-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint edge tests
        run: >-
          ruff check --select E4,E7,E9,F
          tests/test_managed_tick_backtest_edges.py
          tests/test_adaptive_managed_strategy_edges.py
      - name: Run research edge tests
        run: >-
          pytest -q
          tests/test_managed_tick_backtest.py
          tests/test_managed_tick_backtest_edges.py
          tests/test_adaptive_managed_strategy.py
          tests/test_adaptive_managed_strategy_edges.py
      - name: Full suite and coverage
        run: pytest --cov=forex_trader --cov-report=term-missing
