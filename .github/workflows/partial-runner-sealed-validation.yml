name: Partial runner sealed validation

on:
  pull_request:
    paths:
      - "src/forex_trader/research/partial_runner_frozen_validation.py"
      - "scripts/run_partial_runner_sealed_validation.py"
      - "tests/test_partial_runner_frozen_validation.py"
      - ".github/workflows/partial-runner-sealed-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partial-runner-sealed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sealed-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore historical cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: partial-runner-sealed-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            partial-runner-history-${{ runner.os }}-v1-
            adaptive-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v5-
            scalp-fx-history-${{ runner.os }}-v1-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Frozen validation lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/research/partial_runner_frozen_validation.py
          scripts/run_partial_runner_sealed_validation.py
          tests/test_partial_runner_frozen_validation.py
      - name: Frozen validation strict typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          src/forex_trader/research/partial_runner_frozen_validation.py
          scripts/run_partial_runner_sealed_validation.py
      - name: Frozen validation tests
        run: >-
          pytest -q
          tests/test_partial_runner_frozen_validation.py
          tests/test_partial_runner_exact.py
          tests/test_managed_tick_backtest.py
      - name: Run untouched April-May validation
        run: >-
          python scripts/run_partial_runner_sealed_validation.py
          --instruments EUR_USD,GBP_USD,USD_JPY
          --warmup-start 2026-04-01
          --validation-start 2026-04-15
          --validation-end 2026-05-16
          --minimum-proof-trades 20
          --concurrency-per-pair 12
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --output artifacts/partial-runner-sealed-validation.json
      - name: Save historical cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/forex-trader/public-history
          key: partial-runner-sealed-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - name: Summarize sealed result
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/partial-runner-sealed-validation.json").read_text())
          result = report["untouched_validation"]
          r = result["report"]
          goals = report["goal_evaluation"]
          print("## Frozen partial-runner — untouched April-May validation")
          print()
          print(f"Policy source SHA: {report['frozen_policy']['source_development_sha']}")
          print(f"Trades: {r['trades']}")
          print(f"Economic win rate: {result['economic_win_rate']}")
          print(f"Expectancy R: {r['expectancy_r']}")
          print(f"Profit factor: {r['profit_factor']}")
          print(f"Max drawdown R: {r['max_drawdown_r']}")
          print(f"Lower-confidence expectancy R: {result['lower_confidence_expectancy_r']}")
          print(f"20-trade floor met: {goals['sample_floor_met']}")
          print(f"75% historical proof: {goals['historical_75pct_proof']}")
          for risk, metrics in result['risk_scenarios'].items():
              print(f"Avg daily @ {risk}: {metrics['average_daily_return']}")
          PY
      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-runner-sealed-validation
          path: artifacts/partial-runner-sealed-validation.json
          if-no-files-found: warn
          retention-days: 14
