name: Structured-zone development diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-zone-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore completed Jan-Mar history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: structured-zone-diagnostics-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            staged-jan-mar-history-${{ runner.os }}-v1-
            partial-runner-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v5-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Diagnostic lint
        run: ruff check --select E4,E7,E9,F scripts/diagnose_structured_zone_development.py
      - name: Diagnostic strict typing
        run: python -m mypy --strict --follow-imports=silent scripts/diagnose_structured_zone_development.py
      - name: Run opened-tape diagnostics
        run: >-
          python -m scripts.diagnose_structured_zone_development
          --instruments EUR_USD,GBP_USD,USD_JPY
          --start 2026-01-05
          --end 2026-04-01
          --warmup-days 14
          --concurrency-per-pair 12
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --output artifacts/structured-zone-development-diagnostics-v2.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-zone-development-diagnostics-v2
          path: artifacts/structured-zone-development-diagnostics-v2.json
          if-no-files-found: warn
          retention-days: 30
