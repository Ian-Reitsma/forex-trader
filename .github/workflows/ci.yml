name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Dependency integrity
        run: python -m pip check
      - name: Secret assignment scan
        run: python scripts/check_no_secrets.py
      - name: Phase A-D critical lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/adapters/readiness_guard.py
          src/forex_trader/adapters/synthetic.py
          src/forex_trader/api/app.py
          src/forex_trader/application/campaign.py
          src/forex_trader/application/fx_engine.py
          src/forex_trader/application/readiness.py
          src/forex_trader/application/sync.py
          src/forex_trader/config.py
          src/forex_trader/domain/context.py
          src/forex_trader/domain/fusion.py
          src/forex_trader/domain/models.py
          src/forex_trader/domain/position_management.py
          src/forex_trader/domain/risk_advanced.py
          src/forex_trader/domain/setup_lifecycle.py
          src/forex_trader/domain/zone_features.py
          src/forex_trader/infrastructure/advanced_repository.py
          src/forex_trader/ingestion/providers.py
          src/forex_trader/intelligence/events.py
          src/forex_trader/research/advanced.py
          src/forex_trader/research/cohorts.py
          src/forex_trader/research/evidence.py
          src/forex_trader/research/optimization.py
          src/forex_trader/research/order_types.py
          scripts/run_practice_campaign.py
          tests/test_campaign_decision_evidence.py
          tests/test_phase_abcd_context.py
          tests/test_phase_abcd_intelligence.py
          tests/test_phase_abcd_lifecycle_zone.py
          tests/test_phase_abcd_properties.py
          tests/test_phase_abcd_readiness_api.py
          tests/test_phase_abcd_research_management.py
          tests/test_phase_abcd_runtime_integration.py
          tests/test_phase_abcd_synthetic_stability.py
          tests/test_phase_d_entry_profit_optimization.py
          tests/test_research_evidence_cohorts.py
      - name: Strict Phase A-D typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          src/forex_trader/intelligence/events.py
          src/forex_trader/domain/setup_lifecycle.py
          src/forex_trader/domain/position_management.py
          src/forex_trader/research/cohorts.py
          src/forex_trader/research/evidence.py
          src/forex_trader/research/optimization.py
          src/forex_trader/research/order_types.py
      - name: Test and coverage
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest --cov=forex_trader --cov-report=term-missing 2>&1 | tee /tmp/pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### Pytest / coverage — Python ${{ matrix.python-version }}"
            echo '```text'
            tail -n 220 /tmp/pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: /tmp/pytest-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce test result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
      - name: Offline smoke test
        env:
          FOREX_PROVIDER: simulation
          FOREX_MODE: paper
          FOREX_ENABLE_PAPER_ORDERS: "true"
          FOREX_DATABASE_PATH: /tmp/forex-trader-ci.db
        run: forex-trader demo --instrument EUR_USD --execute
