name: Adaptive untouched strategy backtest

on:
  pull_request:
    paths:
      - "src/forex_trader/research/adaptive_managed_strategy.py"
      - "src/forex_trader/research/managed_tick_backtest.py"
      - "src/forex_trader/research/resilient_tick_history.py"
      - "src/forex_trader/research/official_news_history.py"
      - "scripts/run_adaptive_sealed_backtest.py"
      - "tests/test_adaptive_managed_strategy.py"
      - ".github/workflows/adaptive-sealed-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-sealed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore public history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/forex-trader/public-history
          key: adaptive-fx-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
          restore-keys: |
            adaptive-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v5-
            scalp-fx-history-${{ runner.os }}-v1-
            public-fx-history-${{ runner.os }}-v4-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Adaptive strategy lint
        run: >-
          ruff check --select E4,E7,E9,F
          src/forex_trader/research/adaptive_managed_strategy.py
          scripts/run_adaptive_sealed_backtest.py
          tests/test_adaptive_managed_strategy.py
      - name: Adaptive strategy strict typing
        run: >-
          python -m mypy --strict --follow-imports=silent
          src/forex_trader/research/adaptive_managed_strategy.py
          scripts/run_adaptive_sealed_backtest.py
      - name: Adaptive strategy tests
        run: >-
          pytest -q
          tests/test_adaptive_managed_strategy.py
          tests/test_managed_tick_backtest.py
          tests/test_tick_backtest.py
          tests/test_tick_backtest_edges.py
      - name: Run untouched adaptive validation
        run: >-
          python scripts/run_adaptive_sealed_backtest.py
          --instruments EUR_USD,GBP_USD,USD_JPY
          --history-start 2026-05-20
          --validation-start 2026-06-01
          --validation-end 2026-06-28
          --development-start 2026-06-28
          --development-end 2026-08-07
          --profit-targets 0.25,0.33,0.35,0.40,0.50,0.65,0.80
          --minimum-development-trades 24
          --minimum-fold-trades 4
          --minimum-proof-trades 20
          --concurrency-per-pair 12
          --maximum-holding-minutes 120
          --entry-latency-ms 500
          --slippage-pips 0.10
          --output artifacts/adaptive-managed-sealed-backtest.json
      - name: Save incremental public history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/forex-trader/public-history
          key: adaptive-fx-history-${{ runner.os }}-v1-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - name: Summarize untouched validation
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/adaptive-managed-sealed-backtest.json").read_text())
          print("## Causal adaptive strategy — untouched validation")
          print()
          print(f"Validation: {report['period']['untouched_validation_start']} -> {report['period']['untouched_validation_end']}")
          print(f"Development: {report['period']['development_start']} -> {report['period']['development_end']}")
          for name, block in report['selection'].items():
              validation = block['untouched_validation']
              goals = block['goal_evaluation']
              r = validation['report']
              print()
              print(f"### {name}")
              print(f"Trades: {r['trades']}")
              print(f"Economic win rate: {validation['economic_win_rate']}")
              print(f"Expectancy R: {r['expectancy_r']}")
              print(f"Profit factor: {r['profit_factor']}")
              print(f"Max drawdown R: {r['max_drawdown_r']}")
              print(f"75% historical proof: {goals['historical_win_rate_proof']}")
              print(f"75% + 10%/day proof <=2% risk: {goals['historical_joint_goal_proof_at_or_below_2pct_risk']}")
              for risk, metrics in validation['risk_scenarios'].items():
                  print(f"Avg daily @ {risk}: {metrics['average_daily_return']}")
          PY
      - name: Upload adaptive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-managed-sealed-backtest
          path: artifacts/adaptive-managed-sealed-backtest.json
          if-no-files-found: warn
          retention-days: 14
