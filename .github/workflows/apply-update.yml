name: Apply verified source update

on:
  push:
    branches: [main]
    paths:
      - ".forex-update.part*"
      - ".github/workflows/apply-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified archive
        shell: bash
        run: |
          cat .forex-update.part1 .forex-update.part2 .forex-update.part3 .forex-update.part4 .forex-update.part5 | base64 -d > /tmp/forex-update.tar.bz2
          echo "8861de8ee17c1f4bbf908e8a406d23b0c7c8955eede6b6df56b5f4f6e131b9e9  /tmp/forex-update.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/forex-update.tar.bz2
          git add -A

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify extracted source
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q src scripts
          python -m pip check
          python scripts/check_no_secrets.py
          pytest --cov=forex_trader --cov-report=term-missing
          TMPDB=$(mktemp /tmp/forex-trader-update-XXXXXX.db)
          FOREX_PROVIDER=simulation FOREX_MODE=paper FOREX_ENABLE_PAPER_ORDERS=true FOREX_DATABASE_PATH="$TMPDB" forex-trader demo --instrument EUR_USD --execute

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden OANDA practice execution and add walk-forward optimization"
          git push origin HEAD:main
