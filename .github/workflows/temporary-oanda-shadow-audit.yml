name: Temporary OANDA Shadow Audit

on:
  push:
    branches: [phase0-abcd-system-upgrade]

permissions:
  contents: read

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      FOREX_PROVIDER: oanda
      FOREX_MODE: shadow
      FOREX_ENABLE_PAPER_ORDERS: "false"
      FOREX_REQUIRE_FUNDAMENTALS: "true"
      FOREX_INSTRUMENTS: EUR_USD
      FOREX_DATABASE_PATH: /tmp/forex-shadow-audit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Require configured Practice token
        shell: bash
        run: |
          if [ -z "$OANDA_API_TOKEN" ]; then
            echo "OANDA_API_TOKEN Actions secret is unavailable"
            exit 2
          fi
      - name: Read-only Practice probe
        run: python scripts/smoke_oanda.py
      - name: Reconcile broker transaction history
        run: forex-trader sync
      - name: Full-policy live shadow scan
        run: >-
          python scripts/run_practice_campaign.py
          --all-currency-pairs
          --max-instruments 10
          --max-cycles 1
          --interval-seconds 0
          --evidence-path /tmp/oanda-shadow-full.jsonl
      - name: Diagnose full-policy shadow evidence
        run: >-
          python scripts/analyze_campaign.py
          /tmp/oanda-shadow-full.jsonl
          --minimum-cycles 1
          --minimum-evaluations 1
      - name: Technical-only ablation scan
        env:
          FOREX_REQUIRE_FUNDAMENTALS: "false"
          FOREX_DATABASE_PATH: /tmp/forex-shadow-ablation.db
        run: >-
          python scripts/run_practice_campaign.py
          --all-currency-pairs
          --max-instruments 10
          --max-cycles 1
          --interval-seconds 0
          --evidence-path /tmp/oanda-shadow-no-fundamentals.jsonl
      - name: Diagnose technical-only ablation
        env:
          FOREX_REQUIRE_FUNDAMENTALS: "false"
        run: >-
          python scripts/analyze_campaign.py
          /tmp/oanda-shadow-no-fundamentals.jsonl
          --minimum-cycles 1
          --minimum-evaluations 1
      - name: Upload ephemeral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oanda-shadow-audit-evidence
          path: |
            /tmp/oanda-shadow-full.jsonl
            /tmp/oanda-shadow-no-fundamentals.jsonl
          if-no-files-found: ignore
          retention-days: 1
