name: OANDA Practice Validation

on:
  push:
    branches: [v0.5-audit-remediation]

permissions:
  contents: read

jobs:
  practice-smoke:
    if: contains(github.event.head_commit.message, '[practice-smoke]') || contains(github.event.head_commit.message, '[practice-write]')
    runs-on: ubuntu-latest
    env:
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      FOREX_PROVIDER: oanda
      FOREX_MODE: shadow
      FOREX_ENABLE_PAPER_ORDERS: "false"
      FOREX_INSTRUMENTS: EUR_USD,GBP_USD,USD_JPY
      FOREX_REQUIRE_FUNDAMENTALS: "true"
      FOREX_DATABASE_PATH: /tmp/forex-practice.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Verify Practice secrets are configured
        shell: bash
        run: |
          if [[ -z "$OANDA_API_TOKEN" || -z "$OANDA_ACCOUNT_ID" ]]; then
            echo "OANDA Practice credentials are not configured as repository Actions secrets." | tee /tmp/practice-smoke.txt
            exit 2
          fi
          echo "OANDA Practice credentials are configured (values intentionally not printed)." | tee /tmp/practice-smoke.txt
      - name: Read-only authenticated probe
        shell: bash
        run: python scripts/smoke_oanda.py 2>&1 | tee -a /tmp/practice-smoke.txt
      - name: Discover currency universe
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee -a /tmp/practice-smoke.txt
          from forex_trader.config import AppConfig, build_engine
          engine = build_engine(AppConfig.from_env())
          instruments = engine.instrument_universe()
          print({"currency_instruments": len(instruments), "sample": list(instruments[:12])})
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oanda-practice-smoke
          path: /tmp/practice-smoke.txt
          if-no-files-found: warn
          retention-days: 7

  practice-write:
    if: contains(github.event.head_commit.message, '[practice-write]')
    needs: practice-smoke
    runs-on: ubuntu-latest
    env:
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      FOREX_PROVIDER: oanda
      FOREX_MODE: paper
      FOREX_ENABLE_PAPER_ORDERS: "true"
      FOREX_INSTRUMENTS: EUR_USD,GBP_USD,USD_JPY
      FOREX_REQUIRE_FUNDAMENTALS: "true"
      FOREX_DATABASE_PATH: /tmp/forex-practice-write.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Re-run tests immediately before broker write
        run: pytest --cov=forex_trader --cov-report=term-missing
      - name: Protected broker-minimum Practice round trip
        shell: bash
        run: python scripts/oanda_round_trip.py 2>&1 | tee /tmp/practice-write.txt
      - name: Current-market structure scan without further writes
        env:
          FOREX_MODE: shadow
          FOREX_ENABLE_PAPER_ORDERS: "false"
          FOREX_REQUIRE_FUNDAMENTALS: "false"
        shell: bash
        run: forex-trader scan --all-currency-pairs --max-orders 0 2>&1 | tee -a /tmp/practice-write.txt
      - name: Upload Practice trade and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oanda-practice-write
          path: /tmp/practice-write.txt
          if-no-files-found: warn
          retention-days: 7
