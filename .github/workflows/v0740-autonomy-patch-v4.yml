name: v0.7.40 autonomy patch v4

on:
  push:
    branches:
      - feat/autonomous-practice-v0.7.40

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-practice-v0.7.40
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply final autonomy patch
        shell: bash
        run: |
          python - <<'PYFIX'
          from pathlib import Path

          workflow = Path('.github/workflows/v0740-autonomy-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          chunk = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in chunk.splitlines()
          )
          exec(compile(code, 'v0740-bootstrap-patch', 'exec'), {})

          engine = Path('src/forex_trader/application/engine.py')
          text = engine.read_text()
          old = '''        try:\n            interval_seconds = float(payload.get("interval_seconds", 300.0))\n        except (TypeError, ValueError):\n            interval_seconds = 300.0\n'''
          new = '''        raw_interval = payload.get("interval_seconds", 300.0)\n        if isinstance(raw_interval, (int, float, str)):\n            try:\n                interval_seconds = float(raw_interval)\n            except ValueError:\n                interval_seconds = 300.0\n        else:\n            interval_seconds = 300.0\n'''
          if old not in text:
              raise SystemExit('runtime interval typing patch anchor missing')
          text = text.replace(old, new, 1)
          old = '''    def _execution_readiness_reason(self, instrument: str) -> str | None:\n        checker = getattr(self.repository, "execution_ready", None)\n'''
          new = '''    def _execution_readiness_reason(self, instrument: str) -> str | None:\n        if not bool(getattr(self.broker, "requires_runtime_readiness", False)):\n            return None\n        checker = getattr(self.repository, "execution_ready", None)\n'''
          if old not in text:
              raise SystemExit('execution readiness scope patch anchor missing')
          engine.write_text(text.replace(old, new, 1))

          guard = Path('src/forex_trader/adapters/readiness_guard.py')
          text = guard.read_text()
          old = '''class ReconciliationGuardedBroker:\n    """Delegate broker reads but fail closed on writes until reconciliation is durable."""\n\n'''
          new = '''class ReconciliationGuardedBroker:\n    """Delegate broker reads but fail closed on writes until reconciliation is durable."""\n\n    requires_runtime_readiness = True\n\n'''
          if old not in text:
              raise SystemExit('guard capability patch anchor missing')
          guard.write_text(text.replace(old, new, 1))

          integration = Path('tests/test_campaign_integration.py')
          text = integration.read_text()
          old = '''    assert report.orders_protected + report.orders_filled == 1\n'''
          new = '''    assert report.orders_filled == 1\n    assert report.orders_protected == 1\n'''
          if old not in text:
              raise SystemExit('campaign integration telemetry assertion anchor missing')
          integration.write_text(text.replace(old, new, 1))
          PYFIX

      - name: Install dev environment
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Full Ruff
        run: ruff check src scripts tests
      - name: Strict application/domain mypy
        run: |
          mypy --strict \
            src/forex_trader/application \
            src/forex_trader/domain
      - name: Full pytest
        run: pytest -q
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs CHANGELOG.md
          git commit -m 'v0.7.40: make Practice execution autonomous and reconciled'
          git push origin HEAD:feat/autonomous-practice-v0.7.40
